<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111b"><meta name="description" content="Plan weekly meals and build a consolidated grocery list."><title>MealBoard</title><style>body{margin:0;background:#0d111b;color:#eef2ff;font:15px system-ui}main{max-width:1000px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;color:#89b4fa;font-weight:800}.hero{margin:28px 0}.hero h1{font-size:42px;margin:8px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#151c2a;border:1px solid #293449;border-radius:16px;padding:18px}.stack{display:grid;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}label{display:grid;gap:5px;color:#9aa8bf;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1421;color:#eef2ff;border:1px solid #293449;border-radius:9px;padding:10px;font:inherit}button{background:#89b4fa;color:#101522;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary{background:#29364c;color:#eef2ff}.danger{background:#482637;color:#ffdce5}.item{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #293449;border-radius:10px;margin-top:8px;background:#101725}.muted,small{color:#9aa8bf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:24px;border:1px dashed #293449;border-radius:10px;text-align:center;color:#9aa8bf}.stats{display:flex;gap:8px}.stats div{flex:1;background:#101725;padding:10px;border-radius:10px;min-width:0}.stats b{display:block;font-size:20px;overflow-wrap:anywhere}footer{text-align:center;color:#9aa8bf;margin:25px;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:34px}}@media print{body{background:white;color:black}.panel{background:white;color:black}button,header,footer{display:none}}</style></head><body><main><header><span>MealBoard</span><small>LOCAL · PRIVATE · FREE</small></header><section class="hero"><small>ERROR404DTIR / OPEN SOURCE</small><h1>MealBoard</h1><p class="muted">Plan weekly meals and build a consolidated grocery list.</p></section><div class="layout"><section class="panel"><h3>Weekly meal plan</h3><p class="muted">Add ingredients separated by commas.</p><div id="days" class="stack"></div><div class="actions"><button id="backup" class="secondary">Backup JSON</button><label>Restore<input id="restore" type="file" accept=".json"></label></div></section><section class="panel"><h3>Grocery list</h3><div id="groceries"></div><div class="actions"><button id="export">Export TXT</button><button id="copy" class="secondary">Copy</button><button id="clear" class="danger">Clear week</button></div></section></div><footer>Made to be useful · Runs in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x),K='mealboard',days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let p=JSON.parse(localStorage.getItem(K)||'{}');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function items(){let o={};days.forEach(d=>(p[d]?.ingredients||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>o[x.toLowerCase()]=(o[x.toLowerCase()]||0)+1));return Object.entries(o).sort()}function draw(){$('days').innerHTML=days.map(d=>'<div class="item"><div><b>'+d+'</b><input data-day="'+d+'" data-key="meal" placeholder="Meal" value="'+esc(p[d]?.meal||'')+'"><input data-day="'+d+'" data-key="ingredients" placeholder="rice, tomato, onion" value="'+esc(p[d]?.ingredients||'')+'"></div></div>').join('');$('groceries').innerHTML=items().map(([x,n])=>'<div class="item">'+esc(x)+' <small>'+(n>1?'× '+n:'')+'</small></div>').join('')||'<div class="empty">Add ingredients to your plan.</div>'}$('days').oninput=e=>{let d=e.target.dataset.day,k=e.target.dataset.key;if(!d)return;p[d]=p[d]||{};p[d][k]=e.target.value;localStorage.setItem(K,JSON.stringify(p));if(k==='ingredients')drawList()};function drawList(){$('groceries').innerHTML=items().map(([x,n])=>'<div class="item">'+esc(x)+' <small>'+(n>1?'× '+n:'')+'</small></div>').join('')||'<div class="empty">Add ingredients to your plan.</div>'}function dl(n,t){let u=URL.createObjectURL(new Blob([t])),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('export').onclick=()=>dl('grocery-list.txt',items().map(([x,n])=>'- '+x+(n>1?' × '+n:'')).join('\n'));$('backup').onclick=()=>dl('mealboard.json',JSON.stringify(p,null,2));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(items().map(x=>x[0]).join('\n'));$('copy').textContent='Copied'}catch{alert('Clipboard not available; export instead')}};$('clear').onclick=()=>{if(confirm('Clear the week?')){p={};localStorage.removeItem(K);draw()}};$('restore').onchange=async e=>{try{p=JSON.parse(await e.target.files[0].text());localStorage.setItem(K,JSON.stringify(p));draw()}catch{alert('Invalid backup')}};draw();</script></body></html>
